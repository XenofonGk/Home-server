# Drop-in for ollama.service.
# Install: sudo mkdir -p /etc/systemd/system/ollama.service.d
#          sudo cp systemd/ollama-keepalive.conf /etc/systemd/system/ollama.service.d/
#          sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# Two settings, both about staying inside 5.7GB of RAM:
#
#   OLLAMA_KEEP_ALIVE=5m  unload the model 5 minutes after the last request,
#                         instead of holding ~2.5-3GB resident forever.
#   OLLAMA_HOST=127.0.0.1 bind to loopback only. Ollama has no authentication;
#                         anything that can reach it can use it. The Telegram
#                         bridge is the only intended client and it is local.
[Service]
Environment="OLLAMA_KEEP_ALIVE=5m"
Environment="OLLAMA_HOST=127.0.0.1:11434"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
