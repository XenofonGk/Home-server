# Uptime Kuma - monitoring. Installed FIRST so it watches everything after it.
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      # Bound to all interfaces so it is reachable from the LAN. UFW is the
      # gatekeeper, not the port binding.
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    mem_limit: 300m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  uptime-kuma-data:
